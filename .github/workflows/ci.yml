name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting with ttsc
        run: |
          bun run format
          git diff --exit-code

      - name: Check lint and types with ttsc
        run: bun run check

      - name: Verify OpenAPI generation is up-to-date
        run: |
          bun run --cwd packages/openapi generate
          git diff --exit-code -- packages/openapi/spec/listmonk.yaml packages/openapi/generated packages/openapi/src/client/index.ts

      - name: Build all workspaces
        run: bun run build

      - name: Check CLI package size
        run: bun run check:cli-pack-size

      - name: Run unit tests
        run: bun run test:built

      - name: Test native CLI binary
        run: bun run --cwd apps/cli test:binary

  local-stack-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local stack
        run: docker compose up -d

      - name: Wait for Listmonk health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Listmonk health check timed out"
          exit 1

      - name: Configure Mailpit SMTP
        run: ./setup-smtp.sh

      - name: Provision Listmonk API token
        run: bun run stack:bootstrap-auth

      - name: Run CLI smoke checks
        env:
          LISTMONK_OPS_SMOKE_LOG_DIR: /tmp/listmonk-ops-smoke
          LISTMONK_OPS_SMOKE_REPORT: /tmp/listmonk-ops-smoke/report.json
        run: bun run ops:smoke

      - name: Run Postgres webhook runtime integration
        env:
          LISTMONK_OPS_TEST_WEBHOOK_DATABASE_URL: postgres://listmonk:listmonk@127.0.0.1:15432/listmonk
        run: bun test packages/automation/tests/outbound-webhook-postgres.test.ts

      - name: Run Postgres sequence runtime integration
        env:
          LISTMONK_OPS_TEST_SEQUENCE_DATABASE_URL: postgres://listmonk:listmonk@127.0.0.1:15432/listmonk
        run: bun test packages/automation/tests/sequence-postgres.test.ts

      - name: Run MCP E2E tests
        env:
          LISTMONK_OPS_WEBHOOK_DATABASE_URL: postgres://listmonk:listmonk@127.0.0.1:15432/listmonk
        run: bun run test:e2e

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: local-stack-smoke
          path: /tmp/listmonk-ops-smoke
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=200
