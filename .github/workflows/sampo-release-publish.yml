name: Sampo Release Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: sampo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_sha: ${{ steps.release_ref.outputs.sha }}
      verify_release_pr: ${{ steps.release_ref.outputs.verify }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    env:
      SAMPO_RELEASE_BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # When triggered by workflow_run, check out the exact commit CI ran on.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Detect pending changesets
        id: changesets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pending=false
          for changeset in .sampo/changesets/*.md; do
            if [[ "$(basename "$changeset")" != ".gitignore" ]]; then
              pending=true
              break
            fi
          done
          echo "pending=${pending}" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node.js (npm OIDC compatible)
        if: steps.changesets.outputs.pending == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm version for trusted publishing
        if: steps.changesets.outputs.pending == 'false'
        run: |
          set -euo pipefail
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"
          echo "Node ${node_version}"
          echo "npm ${npm_version}"
          node -e 'const [nodeVersion, npmVersion] = process.argv.slice(1); const gte=(a,b)=>{for(let i=0;i<3;i++){const x=(a[i]??0),y=(b[i]??0); if(x>y) return true; if(x<y) return false;} return true;}; const parse=(v)=>v.split(".").map(Number); if(!gte(parse(nodeVersion), [22,14,0])){console.error("Node >= 22.14.0 is required for npm trusted publishing"); process.exit(1);} if(!gte(parse(npmVersion), [11,5,1])){console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1);}' "$node_version" "$npm_version"

      - name: Install dependencies
        if: steps.changesets.outputs.pending == 'false'
        run: bun install --frozen-lockfile

      - name: Build workspaces with Bun
        if: steps.changesets.outputs.pending == 'false'
        run: bun run build

      - name: Run checks and tests before publishing
        if: steps.changesets.outputs.pending == 'false'
        run: bun run check && bun run test && bun run check:package-types

      - name: Detect pending CLI binary release
        id: cli_release
        if: steps.changesets.outputs.pending == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cli_version="$(node -p 'require("./apps/cli/package.json").version')"
          cli_tag="@listmonk-ops/cli-v${cli_version}"
          pending=true
          if git ls-remote --exit-code --tags origin "refs/tags/${cli_tag}" >/dev/null 2>&1; then
            pending=false
          fi
          echo "tag=${cli_tag}" >> "$GITHUB_OUTPUT"
          echo "pending=${pending}" >> "$GITHUB_OUTPUT"

      - name: Route Sampo publishes through npm OIDC
        run: |
          set -euo pipefail
          real_bun="$(command -v bun)"
          wrapper_dir="${RUNNER_TEMP}/sampo-npm-bin"
          mkdir -p "$wrapper_dir"
          cat >"${wrapper_dir}/bun" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "${1:-}" != "publish" ]]; then
            exec "${REAL_BUN}" "$@"
          fi

          shift
          pack_dir="$(mktemp -d "${RUNNER_TEMP}/sampo-npm-pack.XXXXXX")"
          trap 'rm -rf "$pack_dir"' EXIT

          tarball="$("${REAL_BUN}" pm pack --destination "$pack_dir" --ignore-scripts --quiet | tail -n 1)"
          if [[ "$tarball" != /* ]]; then
            tarball="${pack_dir}/${tarball#./}"
          fi
          if [[ ! -f "$tarball" ]]; then
            echo "Packed tarball not found: $tarball" >&2
            exit 1
          fi

          npm publish "$tarball" "$@"
          EOF
          chmod +x "${wrapper_dir}/bun"
          echo "REAL_BUN=${real_bun}" >> "$GITHUB_ENV"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Create release PR or publish packages
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@d3f4020892ba2a8fd56298e417053bb86736fa88 # v0.19.0
        with:
          command: auto
          base-branch: main
          pr-branch: sampo/release
          pr-title: "chore(release): publish packages"
          npm-args: --access public --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAMPO_RELEASE_BRANCH: main

      - name: Dispatch CLI binary release
        if: steps.sampo.outputs.published == 'true' && steps.cli_release.outputs.pending == 'true'
        shell: bash
        env:
          CLI_RELEASE_TAG: ${{ steps.cli_release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/${CLI_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Sampo did not publish ${CLI_RELEASE_TAG}; skipping CLI binary release."
            exit 0
          fi
          gh workflow run cli-github-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --raw-field "tag=${CLI_RELEASE_TAG}"

      # A PR opened or updated with the default GITHUB_TOKEN does not
      # reliably start pull_request workflows. Record the release-branch
      # SHA so a later job can run CI as a reusable workflow and post
      # checks on that commit.
      - name: Record release branch SHA
        id: release_ref
        if: steps.changesets.outputs.pending == 'true' && steps.sampo.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sampo/release
          sha="$(git rev-parse "origin/sampo/release")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "verify=true" >> "$GITHUB_OUTPUT"
          echo "Release branch SHA: ${sha}"

  # Runs the same CI jobs against the sampo/release commit. The called
  # workflow is the copy on this workflow's ref (normally main), so
  # verification does not depend on the release branch's workflow files.
  verify-release-pr:
    needs: release-and-publish
    if: needs.release-and-publish.outputs.verify_release_pr == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-and-publish.outputs.release_sha }}
    permissions:
      contents: read

  # Reusable workflow checks land on this workflow_run's main SHA.
  # Copy the job conclusions onto the release commit so they appear on
  # the release PR and can be required as status checks.
  report-release-pr-ci:
    needs:
      - release-and-publish
      - verify-release-pr
    if: always() && needs.release-and-publish.outputs.verify_release_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
    steps:
      - name: Publish CI checks on the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.release-and-publish.outputs.release_sha }}
          VERIFY_RESULT: ${{ needs.verify-release-pr.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_SHA}" ]]; then
            echo "Missing release SHA" >&2
            exit 1
          fi

          jobs_json="$(gh api --paginate --jq '.jobs[]' "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" | jq -s '{jobs: .}')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          report_job() {
            local expected="$1"
            local job name conclusion details title summary
            job="$(jq -c --arg suffix "$expected" '
              [.jobs[]? | select(.name == $suffix or (.name | endswith(" / " + $suffix)))]
              | last
            ' <<<"$jobs_json")"

            name="$expected"
            if [[ -z "$job" || "$job" == "null" ]]; then
              conclusion="failure"
              if [[ "${VERIFY_RESULT}" == "cancelled" ]]; then
                conclusion="cancelled"
              fi
              details="$run_url"
              title="CI job ${expected} did not run"
              summary="Reusable CI result was \`${VERIFY_RESULT}\` and no job named \`${expected}\` was found in run ${GITHUB_RUN_ID}."
            else
              conclusion="$(jq -r '.conclusion // "failure"' <<<"$job")"
              details="$(jq -r '.html_url // empty' <<<"$job")"
              if [[ -z "$details" ]]; then
                details="$run_url"
              fi
              if [[ -z "$conclusion" || "$conclusion" == "null" ]]; then
                conclusion="failure"
              fi
              title="${expected}: ${conclusion}"
              summary="Copied from the Sampo Release Publish reusable CI run onto the sampo/release commit."
            fi

            gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="$name" \
              -f head_sha="${RELEASE_SHA}" \
              -f status="completed" \
              -f conclusion="$conclusion" \
              -f details_url="$details" \
              -f "output[title]=$title" \
              -f "output[summary]=$summary"
          }

          report_job "build-and-test"
          report_job "local-stack-smoke"

          if [[ "${VERIFY_RESULT}" != "success" ]]; then
            echo "Release PR CI did not succeed (result=${VERIFY_RESULT})" >&2
            exit 1
          fi
